<div class="filterAndSortBar">
    <mat-form-field appearance="outline" id="searchBar">
        <mat-icon matPrefix>search</mat-icon>

        <input
            matInput
            placeholder="Search notes or description..."
            [ngModel]="state.searchTerm"
            (ngModelChange)="onSearchChanged($event)"
        />
    </mat-form-field>

    <mat-form-field appearance="outline" class="selectInputs">
        <mat-label>Date Range</mat-label>

        <mtx-select [items]="dateOptions" bindLabel="label" bindValue="id" [ngModel]="state.selectedDate" (ngModelChange)="onDateChange($event)" [multiple]="false"
            [searchable]="false" [clearable]="false" placeholder="Select date range">
        </mtx-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mtxSelectInputs" subscriptSizing="dynamic">
        <mat-label>Account Types</mat-label>

        <mtx-select [items]="accountTypeOptions()" bindLabel="label" bindValue="id" [ngModel]="state.selectedAccountTypeIds"
            (change)="onAccountTypesChange($event)" (clear)="onAccountTypesChange([])"
            [multiple]="true" placeholder="Select account types">
            <ng-template ng-multi-label-tmp let-items="items">
                {{ items.length }} selected
            </ng-template>
        </mtx-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mtxSelectInputs" subscriptSizing="dynamic">
        <mat-label>Accounts</mat-label>

        <mtx-select [items]="accountOptions()" bindLabel="label" bindValue="id" [ngModel]="state.selectedAccountIds"
            (change)="onAccountsChange($event)" (clear)="onAccountsChange([])"
            [multiple]="true" placeholder="Select accounts">
            <ng-template ng-multi-label-tmp let-items="items">
                {{ items.length }} selected
            </ng-template>
        </mtx-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="selectInputs">
        <mat-label>Sort By</mat-label>

        <mtx-select [items]="sortByOptions" bindLabel="label" bindValue="id" [ngModel]="state.selectedSortBy" (ngModelChange)="onSortByChange($event)"
            [multiple]="false" [searchable]="false" [clearable]="false" placeholder="Sort by">
        </mtx-select>
    </mat-form-field>
</div>
